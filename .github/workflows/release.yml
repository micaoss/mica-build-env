name: release
# Runs only when a release is published (`gh release create <YYYYMMDD-HHMM>
# --target <commit>`), building from the release's tag. The plan job lists the
# build-env images these inputs do not have yet; one job per architecture builds
# them natively on its own runner and pushes <image>.<arch>.<release>; the merge
# job publishes every image as <image>.<release> (built now, or an unchanged
# image under its earlier digest); the assets job
# attaches mica-build-env.lock (mica-lock v1) and SHA256SUMS to the release.
on:
  release:
    types: [published]
  # update.yml calls this after it cuts a release: a release created with
  # GITHUB_TOKEN publishes no event another workflow can start on.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: bun for bin/mica-tools (the source bun row of locks/upstream.lock)
        run: echo "MICA_BUN=$(bash bin/bun.sh "$RUNNER_TEMP/bun")" >> "$GITHUB_ENV"
      - name: The tag is a time YYYYMMDD-HHMM
        run: '[[ "${TAG}" =~ ^[0-9]{8}-[0-9]{4}$ ]] || { echo "error: the tag ${TAG} is not YYYYMMDD-HHMM" >&2; exit 1; }'
      - name: What these inputs still need
        id: plan
        run: |
          set -euo pipefail
          bash publish-images.sh --plan "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          {
            echo "plan<<PLAN"
            cat "$RUNNER_TEMP/plan"
            echo "PLAN"
            echo "build=$(grep -c ' build$' "$RUNNER_TEMP/plan" || true)"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.build != '0'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: bun for bin/mica-tools (the source bun row of locks/upstream.lock)
        run: echo "MICA_BUN=$(bash bin/bun.sh "$RUNNER_TEMP/bun")" >> "$GITHUB_ENV"
      # Restore only, exact key: the archives main's CI gathered for these pins.
      # Without them the images download the archives themselves.
      - name: Restore the ${{ matrix.arch }} toolchain archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mica-fetch-seed
          key: mica-fetch-seed-${{ matrix.arch }}-${{ hashFiles('locks/upstream.lock') }}
      - name: Build natively and push ${{ matrix.arch }}
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export MICA_FETCH_SEED="$RUNNER_TEMP/mica-fetch-seed"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The plan goes outside the checkout: publish-images.sh refuses a dirty tree.
          printf '%s\n' "${PLAN}" >"$RUNNER_TEMP/plan"
          bash publish-images.sh --build "${ARCH}" "${TAG}" "$RUNNER_TEMP/plan"
  merge:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: bun for bin/mica-tools (the source bun row of locks/upstream.lock)
        run: echo "MICA_BUN=$(bash bin/bun.sh "$RUNNER_TEMP/bun")" >> "$GITHUB_ENV"
      - name: Merge both architectures
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s\n' "${PLAN}" >"$RUNNER_TEMP/plan"
          bash publish-images.sh --merge "${TAG}" "$RUNNER_TEMP/plan"
          bash publish-images.sh --resolve "${TAG}" --out "$RUNNER_TEMP/images.rows"
          {
            echo "Image rows:"
            echo '```'
            cat "$RUNNER_TEMP/images.rows"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  assets:
    needs: merge
    # A skipped build (every image already published) would otherwise skip this job too.
    if: always() && needs.merge.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: bun for bin/mica-tools (the source bun row of locks/upstream.lock)
        run: echo "MICA_BUN=$(bash bin/bun.sh "$RUNNER_TEMP/bun")" >> "$GITHUB_ENV"
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publish-release.sh "${TAG}"
